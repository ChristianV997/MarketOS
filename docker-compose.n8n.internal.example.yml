# Internal-only n8n operational automation overlay. Do not publish ports or
# expose this service as a MarketOS customer workflow editor.
services:
  n8n:
    image: n8nio/n8n:2.30.5
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a durable n8n encryption key}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?Set a durable n8n JWT secret}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_internal_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    environment:
      N8N_BASE_URL: http://n8n:5678
      N8N_ALLOWED_HOSTS: n8n
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?Set the token validated by each approved n8n webhook}
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_internal_data:
