name: Agentic Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentic-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused gate dependencies
        # Both packages are declared development tools used by this bounded gate.
        run: python -m pip install --disable-pip-version-check pytest ruff==0.16.1
      - name: Compile agentic tooling
        run: python -m compileall -q scripts tests
      - name: Run local quality-gate preflight
        run: |
          set -o pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "quality_gate_preflight_generated_at: ${generated_at}" >> "$GITHUB_STEP_SUMMARY"
          python scripts/ai/run_local_quality_gate.py --from-git --execute --phase preflight --generated-at "$generated_at" --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write advisory summary
        run: |
          python scripts/ai/select_tests.py --from-git --markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/ai/ci_matrix_plan.py --from-git --markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/ai/phase_gate.py --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Test operating layer
        run: pytest tests/test_agentic_operating_layer.py tests/test_local_quality_gate.py -q
