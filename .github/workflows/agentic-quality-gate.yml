name: Agentic Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentic-quality-gate:
    # Advisory until the gate has a measured false-positive baseline.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        # The gate itself is dependency-free, but its regression tests use pytest.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile agentic tooling
        run: python -m compileall -q scripts tests
      - name: Run local quality gate
        run: python scripts/ai/run_local_quality_gate.py --from-git --json
      - name: Write advisory summary
        run: |
          python scripts/ai/run_local_quality_gate.py --from-git --markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/ai/select_tests.py --from-git --markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/ai/ci_matrix_plan.py --from-git --markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/ai/phase_gate.py --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Test operating layer
        run: pytest tests/test_agentic_operating_layer.py tests/test_local_quality_gate.py -q
