name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Keep CI aligned with the Docker production runtime.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Validate OSS inventory and runtime boundaries
        run: python scripts/validate_oss_runtime.py --json

      - name: Enforce OSS commercial policy
        run: python scripts/check_oss_policy.py

      - name: Validate OSS Compose overlay
        run: python scripts/validate_oss_compose.py

      - name: Validate internal n8n Compose overlay
        run: python scripts/validate_n8n_internal_compose.py

      - name: Validate approval-gated Postiz Compose overlay
        run: python scripts/validate_postiz_compose.py

      - name: Enforce pinned container images
        run: python scripts/validate_container_pins.py

      - name: Validate OCI image provenance contract
        run: python scripts/validate_image_provenance.py

      - name: Generate OSS SBOM manifest
        run: python scripts/generate_oss_sbom.py --output artifacts/oss-sbom.json

      - name: Retain OSS SBOM manifest
        uses: actions/upload-artifact@v4
        with:
          name: marketos-oss-sbom
          path: artifacts/oss-sbom.json
          if-no-files-found: error

      - name: Audit declared Python dependencies
        run: |
          python -m pip install -r requirements-security.txt
          pip-audit -r requirements.txt --strict
          pip-audit -r requirements-oss-agents.txt --strict

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke run (10 cycles)
        run: |
          python - << 'PY'
          from backend.core.state import SystemState
          from backend.execution.loop import run_cycle
          s = SystemState()
          for _ in range(10):
              s = run_cycle(s)
          assert len(s.event_log.rows) > 0
          assert s.total_cycles == 10
          print(f"OK: {s.total_cycles} cycles, capital=${s.capital:.2f}, regime={s.detected_regime}")
          PY

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Validate OSS Compose overlay with Docker
        env:
          MEDUSA_IMAGE: medusajs/medusa:v2.14.2
          MEDUSA_DATABASE_URL: postgres://validation.invalid/marketos
          N8N_ENCRYPTION_KEY: validation-only-encryption-key
          N8N_USER_MANAGEMENT_JWT_SECRET: validation-only-jwt-secret
          N8N_WEBHOOK_TOKEN: validation-only-webhook-token
          POSTIZ_MAIN_URL: https://postiz.validation.invalid
          POSTIZ_BACKEND_URL: https://postiz.validation.invalid/api
          POSTIZ_DATABASE_PASSWORD: validation-only-postiz-password
          POSTIZ_JWT_SECRET: validation-only-postiz-jwt-secret
          POSTIZ_API_TOKEN: validation-only-postiz-api-token
          POSTIZ_COMMERCIAL_APPROVED: "true"
        run: |
          # The base compose file deliberately uses the local .env contract.
          # Supply safe example values for config validation; no services start.
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.oss.example.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.n8n.internal.example.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.postiz.example.yml config --quiet

      - name: Build production image
        run: docker build --build-arg VCS_REF=${{ github.sha }} --tag marketos:ci .

      - name: Verify built-image provenance
        run: |
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.source" }}' marketos:ci)" = "https://github.com/ChristianV997/MarketOS"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' marketos:ci)" = "${{ github.sha }}"

      - name: Start API container
        run: |
          docker run --detach --name marketos-smoke --publish 3000:3000 \
            --env ORCHESTRATOR_HANDLES_CYCLES=true \
            --env SLEEP_ENABLED=0 \
            --env STATE_PATH=/tmp/state.db \
            marketos:ci

      - name: Verify health and dry commerce execution
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health \
              && curl --fail --silent --show-error http://127.0.0.1:3000/ready; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MarketOS API did not become healthy"
              docker logs marketos-smoke
              exit 1
            fi
            sleep 2
          done

          response=$(curl --fail --silent --show-error \
            --request POST http://127.0.0.1:3000/commerce/cycle \
            --header 'content-type: application/json' \
            --data '{"signals":[{"id":"ci-signal","product_id":"ci-product","product":"CI Product","source":"ci","platform":"test","score":0.9,"engagement":0.8,"velocity":0.7,"quality":{"provenance":"live","attribution":"attributed"}}],"products":{"ci-product":{"product_id":"ci-product","name":"CI Product","selling_price":60,"quality":{"provenance":"live","attribution":"attributed"}}},"offers":{"ci-product":{"supplier_id":"ci-supplier","product_id":"ci-product","unit_cost":15,"shipping_cost":5,"inventory_units":100,"quality":{"provenance":"live","attribution":"attributed"}}},"top_k":1,"budget":10}')
          RESPONSE="$response" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESPONSE"])
          assert result["dry_run"] is True, result
          assert result["summary"]["launchable"] == 1, result
          assert result["summary"]["feedback_records"] == 1, result
          print("Container commerce smoke passed:", result.get("artifact_id", "unknown"))
          PY

      - name: Print container logs on failure
        if: failure()
        run: docker logs marketos-smoke || true

      - name: Stop container
        if: always()
        run: docker rm --force marketos-smoke || true
