version: '3.9'
services:
  api:
    build: .
    restart: unless-stopped
    command: uvicorn backend.api:app --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      MARKETOS_ENVIRONMENT: production
      MARKETOS_PUBLIC_COMMERCE_RUNS: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marketos}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    init: true

  # Redis and Postgres are provisioned for a future persistence layer; the
  # current backend/api.py path does not wire them yet (see README Known gaps).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-marketos}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketos} -d ${POSTGRES_DB:-marketos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
