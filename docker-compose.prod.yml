version: '3.9'
services:
  api:
    build: .
    command: uvicorn backend.api:app --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - db
  # redis/db: provisioned for a future Postgres-backed persistence layer
  # (see README.md's "Known gaps"). Not currently wired into backend/api.py
  # or backend/config.py — workspaces are JSON files today, not a database.
  redis:
    image: redis:7
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: upos
      POSTGRES_PASSWORD: upos
      POSTGRES_DB: upos
    ports:
      - "5432:5432"
