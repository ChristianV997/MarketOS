version: "3.9"

# ── Local development stack ───────────────────────────────────────────────────
# Usage:
#   cp deploy/local/.env.local.example .env   # optional credential-free defaults
#   docker compose up api                     # API + Redis + Qdrant
#   docker compose logs -f api                # tail API logs
#
# Liveness: GET /health (process alive). Readiness: GET /ready (runtime initialized).
# The API hot-reloads on code changes via the bind mount.

x-common: &common
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    QDRANT_HOST: qdrant
    QDRANT_PORT: "6333"
    ORCHESTRATOR_HANDLES_CYCLES: "true"
    SLEEP_ENABLED: "0"
    FF_PILLAR_A_INGESTION: "false"
    FF_PILLAR_A_SOURCE_V1: "false"
    FF_RESEARCH_SOURCE_GOOGLE_TRENDS_V1: "false"
    FF_RESEARCH_SOURCE_REDDIT: "false"
    FF_RESEARCH_SOURCE_MERCADOLIBRE: "false"
    FF_RESEARCH_SOURCE_YOUTUBE: "false"
    FF_RESEARCH_SOURCE_AMAZON_BESTSELLERS: "false"
    FF_RESEARCH_SOURCE_TIKTOK_ORGANIC: "false"
    FF_RESEARCH_SWARM_ENABLED: "false"
    TIKTOK_DRY_RUN: "true"
    META_DRY_RUN: "true"
    STORE_DRY_RUN: "true"
    SUPPLIERS_DRY_RUN: "true"
    ADLIB_DRY_RUN: "true"
    MARKETOS_PUBLIC_COMMERCE_RUNS: "0"
    MARKETOS_PUBLIC_SIGNAL_NETWORK: "0"
    COMMERCE_LOOP_LIVE: "false"
  volumes:
    - .:/app
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    <<: *common
    # The orchestrator service owns execution in this multi-service stack.
    # Without this guard both it and the API background runner mutate cycles.
    command: sh -c "ORCHESTRATOR_HANDLES_CYCLES=true exec uvicorn backend.api:app --host 0.0.0.0 --port 3000 --reload"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # ── Orchestrator ──────────────────────────────────────────────────────────
  orchestrator:
    <<: *common
    command: python -m orchestrator.main

  # ── Qdrant vector store ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/marketos-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana_data:
  qdrant_data:
