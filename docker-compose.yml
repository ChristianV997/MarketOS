version: "3.9"

# ── Local development stack ───────────────────────────────────────────────────
# Usage:
#   docker compose up            # start everything
#   docker compose up api        # API only (Redis must be running)
#   docker compose logs -f api   # tail API logs
#
# Secrets: copy .env.example to .env and fill in values.
# The API hot-reloads on code changes via the bind mount.

x-common: &common
  build: .
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    QDRANT_HOST: qdrant
    QDRANT_PORT: "6333"
  volumes:
    - .:/app
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    <<: *common
    # The orchestrator service owns execution in this multi-service stack.
    # Without this guard both it and the API background runner mutate cycles.
    command: sh -c "ORCHESTRATOR_HANDLES_CYCLES=true exec uvicorn backend.api:app --host 0.0.0.0 --port 3000 --reload"
    ports:
      - "3000:3000"

  # ── Orchestrator ──────────────────────────────────────────────────────────
  orchestrator:
    <<: *common
    command: python -m orchestrator.main

  # ── Qdrant vector store ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/marketos-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana_data:
  qdrant_data:
