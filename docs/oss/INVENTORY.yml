    repository: https://github.com/chatwoot/chatwoot
    license: MIT
    mode: sidecar
    status: selected
    owner: sales_automation
    capabilities: [conversation_inbox, support_ticketing]
    reviewed_ref: pending-deferred-review
    # Advanced from `deferred` -> `candidate_for_conversation_sidecar` during
    # the cost-aware stack-planner Phase 1 pass, then to `selected` in Phase
    # 2 once a real ConversationProvider adapter
    # (backend/integrations/chatwoot.py) was built and tested. MIT license,
    # no legal-review gate needed.
  - name: cal.com
    repository: https://github.com/calcom/cal.com
    license: AGPL-3.0
    mode: sidecar
    status: deferred
    owner: sales_automation
    capabilities: [scheduling, appointment_booking]
    reviewed_ref: pending-deferred-review
  - name: posthog
    repository: https://github.com/PostHog/posthog
    license: MIT
    mode: optional_library
    status: selected
    owner: frontend
    capabilities: [product_analytics, pageviews, custom_events]
    reviewed_ref: posthog-js@1.x
    # Consumed as the posthog-js client SDK against PostHog Cloud (SaaS),
    # not self-hosted — no MarketOS-operated PostHog server exists.
    # Default-off: frontend/src/lib/posthog.ts is a no-op unless
    # VITE_POSTHOG_KEY is set, matching this repo's credential-presence-
    # is-the-opt-in convention (e.g. FIRECRAWL_API_KEY). Session-replay is
    # not enabled in this integration — only pageviews + a small set of
    # explicit product events (service_run) are captured.
    # Also consumed server-side via the optional `posthog` Python SDK
    # (backend/integrations/posthog_backend.py, AnalyticsProvider Protocol)
    # for backend event capture + HogQL query, still against PostHog Cloud
    # only — no self-hosted PostHog server.
  - name: temporal
    repository: https://github.com/temporalio/temporal
    license: MIT
    mode: sidecar
