schema_version: 1
commercial_distribution: true
integration_policy: adapters_and_sidecars
candidates:
  - name: medusa
    repository: https://github.com/medusajs/medusa
    license: MIT
    mode: sidecar
    status: selected
    owner: commerce
    capabilities: [catalog, inventory, orders, fulfillment, pricing]
    reviewed_ref: v2.14.2
  - name: saleor
    repository: https://github.com/saleor/saleor
    license: review_required
    mode: benchmark
    status: deferred
    owner: commerce
    capabilities: [headless_commerce, graphql, multichannel_inventory]
    reviewed_ref: pending-benchmark-review
  - name: crawl4ai
    repository: https://github.com/unclecode/crawl4ai
    license: Apache-2.0-with-attribution
    mode: optional_worker
    status: selected
    owner: research
    capabilities: [structured_extraction, browser_crawl, caching]
    reviewed_ref: v0.8.6
  - name: browser-use
    repository: https://github.com/browser-use/browser-use
    license: MIT
    mode: optional_worker
    status: selected
    owner: browser_automation
    capabilities: [persistent_browser, custom_tools, workflow_recovery]
    reviewed_ref: v0.13.6
  - name: pydantic-ai
    repository: https://github.com/pydantic/pydantic-ai
    license: MIT
    mode: optional_library
    status: selected
    owner: agents
    capabilities: [typed_agents, structured_output, mcp, approvals]
    reviewed_ref: v1.104.0
  - name: postiz
    repository: https://github.com/gitroomhq/postiz-app
    license: AGPL-3.0
    mode: sidecar
    status: legal_review_required
    owner: publishing
    capabilities: [social_scheduling, oauth_publishing]
