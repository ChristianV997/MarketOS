  # The following six were evaluated during the consolidation-plan pass
  # (docs/SERVICE_MODULES.md / commercial run envelope work) as candidates
  # to fill genuine gaps (CRM, support inbox, scheduling, product analytics,
  # durable workflow orchestration, web scraping) surfaced by an external
  # audit. Explicit user decision: none adopted this round — deferred
  # pending a dedicated follow-up, not because any is unsuitable.
  - name: twenty-crm
    repository: https://github.com/twentyhq/twenty
    license: AGPL-3.0
    mode: sidecar
    status: deferred
    owner: customer_intelligence
    capabilities: [crm, pipeline, contact_management]
