    owner: research
    capabilities: [web_scraping, browser_crawl]
    reviewed_ref: pending-deferred-review  # redundant with crawl4ai + firecrawl already selected
  # The following three were added during the cost-aware modular business
  # stack pass (backend/providers, backend/costs, backend/stack_planner) —
  # genuinely new candidates with zero prior inventory entries, confirmed
  # via repo-wide grep before adding. See docs/COST_AWARE_INTEGRATION_AUDIT.md.
  - name: woocommerce
    repository: https://github.com/woocommerce/woocommerce
    license: GPL-3.0
    mode: sidecar
    status: legal_review_required
    owner: commerce
    capabilities: [catalog, inventory, orders, refunds]
    reviewed_ref: pending-version-pin
    # Merchant-operated WordPress plugin — no MarketOS-vendored source. An
    # adapter (backend/integrations/woocommerce/) implements the existing
    # CommerceProvider Protocol; no new commerce port was created. GPL-3.0
    # is a restricted license under this repo's own commercial OSS policy
    # (scripts/check_oss_policy.py) — same precedent as Postiz
    # (legal_review_required): the adapter is built and tested, but formal
    # legal review is required before enabling it for a real commercial
    # deployment.
  - name: mautic
    repository: https://github.com/mautic/mautic
    license: GPL-3.0-or-later
    mode: sidecar
    status: legal_review_required
    owner: marketing_automation
    capabilities: [email_marketing, marketing_automation, segmentation]
    reviewed_ref: pending-deferred-review
    # MarketingAutomationProvider adapter built and tested
    # (backend/integrations/mautic.py). GPL-3.0-or-later is copyleft —
    # treated with the same legal-review precedent as GPL-3.0/AGPL-3.0
    # candidates (WooCommerce, Postiz) even though scripts/check_oss_policy.py's
    # RESTRICTED set currently matches the exact string "GPL-3.0" only, not
    # "-or-later" — this status is intentionally more conservative than the
    # automated checker requires.
  - name: activepieces
    repository: https://github.com/activepieces/activepieces
    license: MIT
    mode: sidecar
    status: selected
    owner: workflow_automation
    capabilities: [workflow_automation, connectors]
    reviewed_ref: pending-deferred-review
    # CustomerAutomationProvider adapter built and tested
    # (backend/integrations/activepieces.py) — distinct from the internal-only
    # n8n WorkflowAutomationProvider. MIT license, no legal-review gate needed.
